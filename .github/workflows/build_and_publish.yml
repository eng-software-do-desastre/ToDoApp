on:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -e


      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy -e -X
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_DO_ERICK }} # GITHUB_TOKEN is the default env for the password
